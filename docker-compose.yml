services:
  postgres:
    image: postgres:17
    container_name: pg-chamados
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chamados}
      POSTGRES_USER: ${POSTGRES_USER:-chamados}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chamados-local}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    container_name: api-chamados
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-chamados}
      DB_USERNAME: ${POSTGRES_USER:-chamados}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-chamados-local}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
